name: Build Arsenal Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'arsenal-fabric-1.20.1.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        run: unzip -q arsenal-fabric-1.20.1.zip -d project

      - name: Build Mod
        run: |
          BUILD_FILE=$(find project -type f -name build.gradle -o -name build.gradle.kts | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi
          DIR=$(dirname "$BUILD_FILE")
          cd "$DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Arsenal-Mod
          path: project/**/build/libs/*.jar
          if-no-files-found: error

