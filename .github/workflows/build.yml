
name: Build Arsenal Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'arsenal-fabric-1.20.1.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          unzip -q arsenal-fabric-1.20.1.zip -d project

      - name: Find Gradle and Build
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No Gradle Wrapper found"
            exit 1
          fi

          DIR=$(dirname "$WRAPPER")
          chmod +x "$WRAPPER"
          cd "$DIR"
          ./gradlew build --no-daemon

      - name: Download JAR
        uses: actions/upload-artifact@v4
        with:
          name: Arsenal-Mod
          path: project/**/build/libs/*.jar
          if-no-files-found: error
